<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mouse Test</title>
    <meta name="description"
        content="A minimal mouse test: check every button, the scroll wheel and movement in all four directions on one simple interactive illustration." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f2ede1" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2ede1'/%3E%3Cpath d='M16 5c-4 0-6.5 2.6-6.5 7.5v6C9.5 24 12.2 27 16 27s6.5-3 6.5-8.5v-6C22.5 7.6 20 5 16 5Z' fill='none' stroke='%23625a6b' stroke-width='1.6'/%3E%3Cpath d='M16 5v7M9.5 15h13' fill='none' stroke='%23625a6b' stroke-width='1.2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./js/main.js"></script>
</head>

<body>
    <h1 class="sr-only">Mouse Test</h1>
    <p class="sr-only">
        Move the mouse in any direction to reveal the matching arrow. Scroll the wheel to nudge it
        up or down, and tilt it sideways, if your mouse supports it, to shift it left or right.
        Press any mouse button to highlight that button on the illustration.
    </p>
    <main class="stage" id="stage">
        <div class="stage__note" id="stage-note" hidden></div>
        <noscript>
            <p class="stage__note">This test needs JavaScript to show the illustration.</p>
        </noscript>
    </main>
</body>

</html>
